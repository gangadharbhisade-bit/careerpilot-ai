services:
  # FastAPI Web Service
  - type: web
    name: careerpilot-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://careerpilot-ai-frontend.onrender.com"

  # React Static Site
  - type: web
    name: careerpilot-ai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://careerpilot-ai-backend.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: careerpilot-db
    databaseName: careerpilot
    user: careerpilot_user
    plan: free
